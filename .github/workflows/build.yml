name: Android APK ARM64 - audit and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    name: Build, unit tests, signatures and ARM64
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Verify known unsafe release key is not shipped
        run: |
          set -eu
          test ! -f keystore/bfe-test.jks
          if grep -R -E 'storePassword[[:space:]]+["\x27]bfetest|keyPassword[[:space:]]+["\x27]bfetest' app/build.gradle; then
            echo "Public BFE test signer remains configured" >&2
            exit 1
          fi

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest

      - name: Upload debug APK for smoke testing
        uses: actions/upload-artifact@v4
        with:
          name: android-app-cloner-debug-arm64
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Check if private release signing is configured
        if: github.event_name != 'pull_request'
        id: signing
        env:
          APK_SIGNING_KEYSTORE_B64: ${{ secrets.APK_SIGNING_KEYSTORE_B64 }}
          APK_SIGNING_PASSWORD: ${{ secrets.APK_SIGNING_PASSWORD }}
          APK_SIGNING_ALIAS: ${{ secrets.APK_SIGNING_ALIAS }}
        run: |
          if [ -n "$APK_SIGNING_KEYSTORE_B64" ] && [ -n "$APK_SIGNING_PASSWORD" ] && [ -n "$APK_SIGNING_ALIAS" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No private signing secrets: debug test APK only, no release APK."
          fi

      - name: Restore private release signing key from encrypted secret
        if: steps.signing.outputs.available == 'true'
        env:
          APK_SIGNING_KEYSTORE_B64: ${{ secrets.APK_SIGNING_KEYSTORE_B64 }}
        run: |
          set -eu
          test -n "$APK_SIGNING_KEYSTORE_B64"
          printf '%s' "$APK_SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/android-app-cloner-release.p12"
          chmod 600 "$RUNNER_TEMP/android-app-cloner-release.p12"

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          APK_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/android-app-cloner-release.p12
          APK_SIGNING_PASSWORD: ${{ secrets.APK_SIGNING_PASSWORD }}
          APK_SIGNING_ALIAS: ${{ secrets.APK_SIGNING_ALIAS }}
        run: |
          set -eu
          test -n "$APK_SIGNING_PASSWORD"
          test -n "$APK_SIGNING_ALIAS"
          # Avoid writing signing credentials into Gradle configuration caches.
          ./gradlew --no-daemon --no-configuration-cache :app:assembleRelease

      - name: Audit release signatures, package, minimum SDK and native ABI
        if: steps.signing.outputs.available == 'true'
        run: |
          set -eu
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > apk-signature-report.txt
          grep -F -q 'Verified using v2 scheme (APK Signature Scheme v2): true' apk-signature-report.txt
          grep -F -q 'Verified using v3 scheme (APK Signature Scheme v3): true' apk-signature-report.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > apk-metadata-report.txt
          grep -F -q "package: name='com.hatusjc.androidappcloner'" apk-metadata-report.txt
          grep -F -q "sdkVersion:'26'" apk-metadata-report.txt
          unzip -Z -1 "$APK" | grep -E '^lib/arm64-v8a/' > apk-native-libraries.txt
          test -s apk-native-libraries.txt
          sha256sum "$APK" > apk-sha256.txt
          cat apk-sha256.txt

      - name: Upload verified release and its audit evidence
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-app-cloner-release-arm64
          path: |
            app/build/outputs/apk/release/app-release.apk
            apk-sha256.txt
            apk-signature-report.txt
            apk-metadata-report.txt
            apk-native-libraries.txt
          if-no-files-found: error
          retention-days: 90
